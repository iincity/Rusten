[package]
name = "nsh-platform-windows"
description = "Windows backend (Win32, Direct2D, DirectWrite): view mounting, text engine, input, standalone app."
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://nsh.dev"
readme = "README.md"
repository = "https://github.com/longbridge/nsh"

[features]
default = ["js"]
js = ["nsh-engine/js"]
dev = ["js", "dep:nsh-dev", "dep:nsh-testing"]

[dependencies]
log = { version = "0.4" }

[target.'cfg(windows)'.dependencies]
nsh-core = { version = "0.3.0", git = "https://github.com/longbridge/nsh.git", tag = "v0.3.0", features = ["svg"] }
nsh-engine = { version = "0.3.0", default-features = false, git = "https://github.com/longbridge/nsh.git", tag = "v0.3.0", features = ["net"] }
nsh-base = { version = "0.3.0", default-features = false, git = "https://github.com/longbridge/nsh.git", tag = "v0.3.0", features = ["highlight"] }
windows = { version = "0.62", features = ["std", "Foundation_Numerics", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Imaging_D2D", "Win32_Media_MediaFoundation", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = { version = "0.62" }
windows-numerics = { version = "0.3" }
webview2-com = { version = "0.39" }
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
rustc-hash = { version = "2.1" }
serde_json = { version = "1" }
url = { version = "2.5" }
ttf-parser = { version = "0.25" }
ureq = { version = "3.1" }
crossbeam-channel = { version = "0.5" }
nsh-dev = { version = "0.3.0", git = "https://github.com/longbridge/nsh.git", tag = "v0.3.0", features = ["client"], optional = true }
nsh-testing = { version = "0.3.0", default-features = false, git = "https://github.com/longbridge/nsh.git", tag = "v0.3.0", features = ["agent"], optional = true }

[lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"
