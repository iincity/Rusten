[package]
name = "uffs-mft"
version = "0.6.41"
edition = "2024"
license = "MPL-2.0"
autobins = false

[lib]
path = "../UltraFastFileSearch/crates/uffs-mft/src/lib.rs"
test = false
doctest = false

[dependencies]
uffs-version = { path = "../UltraFastFileSearch/crates/uffs-version" }
uffs-polars = { path = "../UltraFastFileSearch/crates/uffs-polars" }
uffs-text = { path = "../UltraFastFileSearch/crates/uffs-text" }
uffs-security = { path = "../UltraFastFileSearch/crates/uffs-security" }
bitflags = "2.13.2"
smallvec = "1.16.1"
thiserror = "2.0.20"
anyhow = "1.0.104"
rayon = "1.12.0"
zstd = { version = "0.13.3", features = ["zstdmt"] }
clap = { version = "4.6.7", features = ["derive", "env", "unicode", "wrap_help"] }
indicatif = "0.18.6"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time", "tracing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "time", "env-filter"] }
tracing-appender = "0.2.5"
dirs-next = "2.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
hostname = "0.4.2"
rustc-hash = "2.1.3"
zerocopy = { version = "0.8.56", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
rand_chacha = "0.10.0"
crossbeam-channel = "0.5.17"
bytemuck = { version = "1.25.2", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_IO",
    "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_ProcessStatus",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
