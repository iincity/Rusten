[match]
paths = ["C:/Users/*/AppData/Local/*/Cache/*"]

[exclude]
paths = [
  "*/Login Data*",
  "*/Cookies*",
  "*/Web Data*",
  "*/History*",
  "*/Bookmarks*",
  "*/Local State*",
  "*/Session Storage*",
  "*/Mail*",
  "*/Messages*",
  "*/Teams*",
  "*/WeChat*",
  "*/Weixin*",
  "*.db",
  "*.sqlite",
  "*.sqlite3",
  "*.pst",
  "*.ost",
]
