id = "app_cache"
name = "Rebuildable application caches"
category = "app_cache"
group = "常用软件专清"
group_order = 30
display_name = "应用缓存"
display_order = 10
item_from_path_after = "AppData/Local"
mode = "quick"
risk = "P3"
confidence = "high"
recovery = "backup_then_delete"
processes = []
requires_admin = false
warning = "Application cache data can be rebuilt; sensitive databases are excluded"
version = "1"

[[display_items]]
key = "app.vlc"
name = "VLC播放器"
order = 10
paths = ["C:/Users/*/AppData/Local/VLC/Cache/*"]

